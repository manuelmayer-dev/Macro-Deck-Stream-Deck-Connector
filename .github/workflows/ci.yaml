name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build StreamDeckConnector.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test StreamDeckConnector.slnx -c Release --no-build

      # Always the MacroDeckSdkVersion from Directory.Packages.props.
      - name: Install the plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.5

      - name: Conformance
        run: macrodeck-plugin test --project src/StreamDeckConnector --required-only

  package:
    name: Pack and validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Always the MacroDeckSdkVersion from Directory.Packages.props.
      - name: Install the plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.5

      - name: Build the package
        run: macrodeck-plugin build --source src/StreamDeckConnector --output ./artifacts

      - name: Validate the package
        run: macrodeck-plugin validate --level publication --artifact ./artifacts/*.macroDeckPlugin
